o.jsxs)("div",{className:"flex flex-wrap items-center gap-x-5 gap-y-2",children:[(0,o.jsxs)("div",{className:"flex items-baseline gap-2",children:[(0,o.jsx)("span",{className:`text-[2rem] leading-none font-extrabold tracking-tight ${u?"text-pen":""}`,"aria-label":"time elapsed",children:s(e)}),(0,o.jsxs)("span",{className:"text-sm text-inksoft",children:[n?"running":"stopped"," · aim for ",t," min"]})]}),(0,o.jsxs)("span",{className:"text-sm text-inksoft",children:[l," of ",i," answered"]}),n&&(0,o.jsx)("button",{onClick:r,disabled:!a,className:"ml-auto rounded-md bg-ink px-5 py-2 font-semibold text-white disabled:opacity-35 disabled:cursor-not-allowed",children:"Submit and stop the clock"})]})})}let f=[{week:1,topic:"Work & Study",language:"job and study collocations · present perfect vs past simple"},{week:2,topic:"Hometown, Travel & Places",language:"describing places · used to / would · comparatives with intensifiers"},{week:3,topic:"Technology & Media",language:"tech and internet language · modals of deduction and obligation"},{week:4,topic:"Health, Lifestyle & Free Time",language:"habits and wellbeing · conditionals and wish"}],d=["Pick one version. Each one uses a different IELTS question type, so do them on different days rather than all at once.","The clock starts when you press Begin and stops when you submit. There is no time limit — the point is to find out how long you actually take.","Read the whole passage once before you look at the questions. Resist starting with question 1.","Answer every question. Nothing is deducted for a wrong answer.","You can look back at the passage as often as you like. It stays on screen the whole time.","Nothing is saved when you close the page, so write your score and your time down."],p=[{id:"v1",week:1,topic:"Work & Study",title:"The four-day week, tested",standfirst:"What a set of workplace trials did and did not show.",format:"Matching headings",formatRule:"Choose the correct heading for each paragraph from the list. There are seven headings and five paragraphs, so two headings are not used. Each heading is used once only.",targetMin:8,headings:[{key:"i",text:"A proposal with a longer history than people assume"},{key:"ii",text:"Counting things nobody had counted before"},{key:"iii",text:"Growing political support for shorter hours"},{key:"iv",text:"Steady output, fewer departures"},{key:"v",text:"The habit that refused to change"},{key:"vi",text:"The cost of paying five days for four"},{key:"vii",text:"Workplaces the model does not fit"}],headingsNote:"Two of these seven headings belong to no paragraph at all.",paras:[{label:"A",text:"The idea of a shorter working week is not new. Proposals for a four-day week appeared in trade union pamphlets in the 1950s, long before any company tried one. What changed recently is that a number of employers agreed to run the experiment properly: the same pay, four days instead of five, and measurement carried out from the outside rather than by the companies themselves."},{label:"B",text:"The trials that followed were unusual in what they chose to record. Output mattered, of course, but the organisers also tracked how many staff left, how often people were off sick, and how employees rated their own stress and sleep. Several of the firms involved had never gathered figures of that kind before, which made the first month as much an exercise in record-keeping as in scheduling."},{label:"C",text:"On the central question, the results were undramatic in a way the organisers considered encouraging. Across most participating firms, output held roughly steady — neither the collapse that sceptics predicted nor the surge that enthusiasts hoped for. Revenue in the trial period was broadly in line with the same months a year earlier. Staff turnover, meanwhile, fell noticeably: far fewer people resigned during the trial than in the year before it."},{label:"D",text:"One finding sat awkwardly with the rest. Meetings, which had been expected to shrink, barely changed. Managers reported cutting them in the first fortnight and then drifting back towards the old pattern, squeezing the same discussions into fewer days. Where the shorter week genuinely worked, it was usually because a team had rebuilt the way it handled interruptions, not because it had simply removed a day."},{label:"E",text:"The trials also made clear where the model does not travel. Firms whose work arrives unpredictably — hospitals, repair services, anything with a queue of waiting customers — could not simply close on a Friday. For those, the organisers suggested staggered shifts rather than a shared day off, while admitting that the evidence from the trials says very little about whether that version works."}],items:[{n:1,prompt:"Paragraph A",kind:"choice",options:["i","ii","iii","iv","v","vi","vii"],answer:"i",note:"The 1950s pamphlets are the whole point of this paragraph: the idea is older than people think. Heading iii is the trap — the paragraph never mentions politics or government."},{n:2,prompt:"Paragraph B",kind:"choice",options:["i","ii","iii","iv","v","vi","vii"],answer:"ii",note:'"Several of the firms had never gathered figures of that kind before" is the line that decides it.'},{n:3,prompt:"Paragraph C",kind:"choice",options:["i","ii","iii","iv","v","vi","vii"],answer:"iv",note:"Two findings sit side by side: output held steady, and fewer people resigned. A heading has to cover both, which is why iv beats anything about output alone."},{n:4,prompt:"Paragraph D",kind:"choice",options:["i","ii","iii","iv","v","vi","vii"],answer:"v",note:'Meetings were expected to shrink and did not. "Drifting back towards the old pattern" is the habit in the heading.'},{n:5,prompt:"Paragraph E",kind:"choice",options:["i","ii","iii","iv","v","vi","vii"],answer:"vii",note:"Hospitals and repair services are the examples. The paragraph is about where the model fails to apply, not what it costs."}]},{id:"v2",week:2,topic:"Hometown, Travel & Places",title:"The village that filled up again",standfirst:"Calder Bridge lost half its residents, then got them back.",format:"True / False / Not Given",formatRule:"Write True if the statement agrees with the passage, False if it contradicts the passage, and Not Given if there is no information about it either way. False and Not Given are not the same thing.",targetMin:7,paras:[{label:"A",text:"Sixty years ago Calder Bridge had two shops, a school and just under 900 residents. By 2015 the school had closed, one shop remained, and the population had fallen below 400. The pattern was familiar across the region: young people left for work in the cities, and nobody replaced them."},{label:"B",text:"What happened next was not planned. As remote working spread after 2020, a handful of families bought houses in the village at prices far below city levels. The council had made no effort to attract them and had no incentive scheme of any kind in place. By 2024 the population had climbed back above 600."},{label:"C",text:'The arrivals were not universally welcomed. House prices rose by roughly 40 per cent in three years, which pleased residents who owned property and alarmed those who did not. Two long-standing residents interviewed by a regional newspaper described the village as "comfortable but no longer ours".'},{label:"D",text:"The school has not reopened, and there is no proposal to reopen it; children are taken by bus to a town eleven kilometres away. The second shop, however, returned in 2023, and a bus service that had been cut back in 2011 now runs three times a day instead of twice."}],items:[{n:1,prompt:"Calder Bridge's population more than halved between the 1960s and 2015.",kind:"choice",options:["True","False","Not Given"],answer:"True",note:"Just under 900 down to below 400 is a fall of more than half. The passage gives both figures, so this is True rather than Not Given."},{n:2,prompt:"The council set up a scheme to attract new residents to the village.",kind:"choice",options:["True","False","Not Given"],answer:"False",note:'Paragraph B says the council "had no incentive scheme of any kind in place". The passage states the opposite of the claim, so it is False.'},{n:3,prompt:"All the residents were pleased that house prices had risen.",kind:"choice",options:["True","False","Not Given"],answer:"False",note:'It "pleased residents who owned property and alarmed those who did not". The word that makes the statement false is *all*.'},{n:4,prompt:"Most of the newcomers were families with young children.",kind:"choice",options:["True","False","Not Given"],answer:"Not Given",note:'The passage says "a handful of families" and nothing about how old the children were or whether families were the majority. Nothing confirms or denies it.'},{n:5,prompt:"The bus service is now more frequent than it was before it was cut back.",kind:"choice",options:["True","False","Not Given"],answer:"True",note:"It ran twice a day and now runs three times. The comparison is with the reduced service, which the last sentence spells out."}]},{id:"v3",week:3,topic:"Technology & Media",title:"Reading on a screen",standfirst:"What eye-tracking studies found when readers moved from paper to glass.",format:"Sentence completion",formatRule:"Complete each sentence with NO MORE THAN TWO WORDS taken from the passage. Use the words exactly as they appear — do not change their form.",targetMin:8,paras:[{label:"A",text:"When researchers began tracking readers' eyes across web pages in the late 1990s, they found something print designers had not planned for. Readers did not move steadily down the page. They swept across the top, dropped down, swept across again more briefly, then ran their eyes down the left-hand margin — a route now usually described as an F-shaped pattern."},{label:"B",text:"Scanning is not in itself a weakness; it is an efficient way of deciding whether a page is worth reading. The difficulty appears when a text requires sustained attention. In comparison studies, readers of short pieces performed much the same on screen as on paper. With longer and more demanding texts, however, those reading on paper recalled more detail and were markedly better at putting events into the correct order."},{label:"C",text:"A second finding is harder to design around. Screen readers consistently overestimated how much of a text they had absorbed, rating their own comprehension higher than their test scores justified. Paper readers judged themselves more accurately. The gap did not close when participants were warned about it in advance."},{label:"D",text:"Publishers have responded with shorter paragraphs, more subheadings and a narrower column of text — changes that make scanning easier rather than discouraging it. Whether that is the right response is still argued over."}],items:[{n:1,prompt:"Eye-tracking research describes the route readers take across a web page as an ______ pattern.",kind:"text",accept:["F-shaped","f shaped","F shaped","f-shaped"],note:'Paragraph A, last line. The hyphen does not matter here, but the word does: "F" alone is not the pattern.'},{n:2,prompt:"Scanning is an efficient way of judging whether a page is ______ reading.",kind:"text",accept:["worth"],note:'Paragraph B, first sentence: "deciding whether a page is worth reading". One word is enough, so adding more loses the mark.'},{n:3,prompt:"With demanding texts, paper readers were better at putting events into the correct ______.",kind:"text",accept:["order"],note:'Paragraph B, last line. The passage says "the correct order" — take the word that fits the gap, not the whole phrase.'},{n:4,prompt:"Screen readers consistently ______ how much of a text they had absorbed.",kind:"text",accept:["overestimated"],note:'Paragraph C, first line. The form in the passage already fits the sentence, so copy it as it stands rather than writing "overestimate".'},{n:5,prompt:"Publishers now use shorter paragraphs, more subheadings and a ______ column of text.",kind:"text",accept:["narrower"],note:'Paragraph D. "Narrow" would be a changed form, and changed forms are marked wrong in this question type.'}]},{id:"v4",week:4,topic:"Health, Lifestyle & Free Time",title:"When a hobby stops being a hobby",standfirst:"The language of work has moved into the time that was meant to be free of it.",format:"Matching information",formatRule:"Which paragraph contains the following information? Write the correct letter, A to D. You may use any letter more than once, and one paragraph is used twice.",reuseNote:"One paragraph is the answer to two of the five questions.",targetMin:7,paras:[{label:"A",text:"For most of the twentieth century a hobby was understood as something deliberately useless. Stamp collecting, model railways, amateur choirs — the point was that they produced nothing anyone needed and answered to nobody. Writers on leisure at the time treated that uselessness as the whole value of the thing."},{label:"B",text:"That understanding has shifted. Surveys of younger adults now find a substantial minority describing a pastime in terms of what it might eventually earn: an audience, a second income, a portfolio. The vocabulary of work has moved into the space that was designed to be free of it."},{label:"C",text:"The consequences are mixed rather than simply bad. People who make money from a pastime often report learning faster and practising more regularly, because an audience creates a deadline. The same people are markedly more likely to call the activity stressful, and a minority abandon it altogether when the income fails to arrive."},{label:"D",text:"Some have responded by keeping two categories deliberately apart: one activity that is allowed to earn, and another protected from any expectation of improvement at all. Teachers of amateur music report recommending that split far more often than they did a decade ago."}],items:[{n:1,prompt:"a definition of a hobby that depends on it being unproductive",kind:"choice",options:["A","B","C","D"],answer:"A",note:'"Deliberately useless… produced nothing anyone needed." Paragraph A is the only one that defines the term.'},{n:2,prompt:"a method of protecting one activity from pressure",kind:"choice",options:["A","B","C","D"],answer:"D",note:'Keeping two categories apart, one "protected from any expectation of improvement". A method means a thing people do, not a problem they have.'},{n:3,prompt:"evidence that earning money can make people practise more often",kind:"choice",options:["A","B","C","D"],answer:"C",note:'"Learning faster and practising more regularly, because an audience creates a deadline."'},{n:4,prompt:"a change in the way younger people talk about their free time",kind:"choice",options:["A","B","C","D"],answer:"B",note:'Surveys of younger adults, and the vocabulary of work moving in. The word to spot is "talk" — this is about language, not behaviour.'},{n:5,prompt:"a reference to people giving up when the money does not follow",kind:"choice",options:["A","B","C","D"],answer:"C",note:'"A minority abandon it altogether when the income fails to arrive." This is the second answer in paragraph C — the instruction warned you a letter repeats.'}]}],h=e=>e.paras.reduce((e,t)=>e+t.text.trim().split(/\s+/).length,0),m=e=>e.toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim(),g=(e,t)=>!!t&&("choice"===e.kind?e.answer===t:(e.accept||[]).some(e=>m(e)===m(t)));(0,u.createRoot)(document.getElementById("root")).render((0,o.jsx)(i.StrictMode,{children:(0,o.jsx)(function(){let[e,t]=(0,i.useState)("home"),[n,r]=(0,i.useState)(p[0].id),[a,l]=(0,i.useState)({}),[u,m]=(0,i.useState)(null),[v,y]=(0,i.useState)(null),b=(0,i.useMemo)(()=>p.find(e=>e.id===n),[n]),w=function(e,t){let[n,r]=(0,i.useState)(()=>Date.now());return((0,i.useEffect)(()=>{if(null===e||null!==t)return;let n=window.setInterval(()=>r(Date.now()),500);return()=>window.clearInterval(n)},[e,t]),null===e)?0:Math.max(0,((t??n)-e)/1e3)}(u,v),k=b.items.filter(e=>(a[e.n]||"").tri
